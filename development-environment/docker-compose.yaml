version: "3"

services:
  wiremock:
    image: wiremock/wiremock:3.3.1-alpine
    command: "--local-response-templating"
    ports:
      - "5050:8080"
    volumes:
      - ./wiremock:/home/wiremock:ro
    networks:
      - dev

  localstack:
    image: localstack/localstack:4
    ports:
      - "127.0.0.1:4510-4559:4510-4559"  # external service port range
      - "127.0.0.1:4566:4566"            # LocalStack Edge Proxy
    environment:
      - DEBUG=${DEBUG:-0}
      - SERVICES=sns,sqs,s3
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${TMPDIR:-/tmp}/localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - ./localstack/start-localstack.sh:/etc/localstack/init/ready.d/start-localstack.sh
    networks:
      - dev

  gcp-emulator:
    image: google/cloud-sdk:latest
    volumes:
      - ./gcp-emulator:/scripts
    ports:
      - "8686:8686"  # Porta para o Pub/Sub
      - "8080:8080"  # Porta para o Storage
    entrypoint: ["/bin/bash", "-c"]
    command: ["/scripts/start.sh"]
    networks:
      - dev

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts:/etc/prometheus/rules:ro
    networks:
      - dev

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "3030:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/dashboards:/var/lib/grafana/dashboards/colibri:ro
    depends_on:
      - prometheus
    networks:
      - dev

networks:
  dev:
